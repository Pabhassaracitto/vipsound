name: in4up
description: In4Up - Read, remember, learn, and listen with the UltraTimeStretch Engine

publish_to: 'none'

version: 1.4.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  in4up_stt:
    path: ./packages/in4up_stt
  in4up_core:
    path: ./packages/in4up_core
  in4up_ai:
    path: ./packages/in4up_ai
  # Tipitaka integration
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.4.0+3 # SQLite implementation for Windows/Linux tests
  archive: ^4.0.9 # unpack downloadable SQLite language packs
  # UI
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2 # change from ^0.18.0

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio_platform_interface: ^4.0.0
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.3 #0.2.1   # ← THÊM DÒNG NÀY!
  audio_session: ^0.2.2

  # FFI for Native C++ Engine
  ffi: ^2.1.3

  # File & Storage
  file_picker: ^11.0.2 # change from 8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.1

  # Utilities
  rxdart: ^0.28.0  # Stream utilities
  equatable: ^2.0.5

  cupertino_icons: ^1.0.8

  # NEW
  hive: ^2.2.3                    # Local database
  hive_flutter: ^1.1.0            # Hive cho Flutter
  audio_service: ^0.18.12         # Background playback

  uuid: ^4.2.1                    # Generate unique IDs
  share_plus: ^12.0.2              # Share segments
  shared_preferences: ^2.3.5  # THÊM DÒNG NÀY
  flutter_tts: ^4.2.0  # THÊM DÒNG NÀY
  just_waveform: ^0.0.7  # Đọc waveform từ audio file
  record: ^6.1.2 # ghi âm
  record_windows: ^1.0.1 # ★ BẮT BUỘC cho Windows
  oauth2: ^2.0.2
  url_launcher: ^6.2.5               # cho word_actions_sheet tra từ online

  http: ^1.2.2
  connectivity_plus: ^6.1.4 #7.1.0    # Check network
  crypto: ^3.0.6                 # MD5 hash cho cache key

  # Dịch offline on-device (Android/iOS) — model CHỈ tải khi user bấm
  # (màn Cài đặt engine dịch), không auto-download lúc mở app.
  # PIN 0.14.x: bản 0.15.1 yêu cầu Dart SDK ^3.12.0 — CI + máy chủ là
  # Flutter 3.44.1 (Dart 3.11.5) → version solving fail. API 0.14.0 ==
  # 0.15.1 (đã đối chiếu source flutter-ml/google_ml_kit_flutter).
  google_mlkit_translation: ^0.14.0
# Firebase core (bắt buộc)
  firebase_core: ^3.15.2 #4.7.0 #change from 4.0.0
  
  # Firebase Auth (đăng nhập anonymous)
  firebase_auth: ^5.7.0 #6.4.0
  
  # Cloud Firestore (database)
  cloud_firestore: ^5.6.12 #6.0.0
  google_sign_in: ^6.2.1 #7.2.0 Giữ nguyên hoặc nâng lên mới nhất
  googleapis: ^16.0.0

  # Youglish Android & iOS
  webview_flutter: ^4.9.0
  # Youglish Win
  webview_win_floating: ^3.0.0
  webview_windows: ^0.4.0   # Chỉ cho Windows
  # Youtube
  youtube_explode_dart: ^3.0.5
  pdfrx: ^2.2.24          # PDF render + text extraction (Android/iOS/Windows)
  graphview: ^1.2.0  
  animations: ^2.1.2
  flutter_animate: ^4.5.2
  flutter_gen: ^5.9.0
  device_preview: ^1.2.0
dependency_overrides:
  pdfium_flutter:
    path: third_party/pdfium_flutter
  just_audio_platform_interface: 4.6.0  # KHÔNG dùng ^
  just_audio_web: 0.4.16                # KHÔNG dùng ^
  audio_session: 0.2.2                  # KHÔNG dùng ^

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1          # Generate Hive adapters
  build_runner: ^2.4.13            # Code generation
  flutter_launcher_icons: ^0.14.4
ffigen: ^9.1.3
  
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dictionary/ 
    - assets/icons/   
    - assets/whisper_models/
    - assets/glossary/
    # Optional small/demo normalized Tipiṭaka DB. Production builds may omit
    # it and install a DB into the app documents directory instead.
    - assets/db/tipitaka.sqlite
